# Cloudflare Worker deployment of the same router code.
# Deployed by .github/workflows/router-deploy.yml when CLOUDFLARE_API_TOKEN exists, or by hand:
#   cd terminal/router
#   pnpm dlx wrangler secret put OPENROUTER_API_KEY   # and OPENAI_API_KEY, GOOGLE_API_KEY
#   pnpm dlx wrangler deploy
name = "fresh-terminal-router"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://imagine-os.github.io,http://localhost:5173,http://localhost:4173"
