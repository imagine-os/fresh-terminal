# Cloudflare Worker deployment of the same router code.
# Deployed by .github/workflows/router-deploy.yml when CLOUDFLARE_API_TOKEN exists. That workflow:
#   1. makes sure the D1 database "fresh-terminal" exists and writes its id over D1_DATABASE_ID below,
#   2. applies migrations/ to it (remote),
#   3. runs `wrangler deploy`, which also attaches the custom domain api.freshterminal.ai
#      (Cloudflare creates the DNS record and certificate),
#   4. pushes Worker secrets (OPENROUTER_API_KEY, CLERK_SECRET_KEY, CLERK_JWT_KEY, ...) over stdin, and
#      creates DEVICE_SIGNING_KEY once (random, never printed, kept across deploys).
# The workers.dev URL stays on as a fallback.
name = "fresh-terminal-router"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "api.freshterminal.ai", custom_domain = true },
]

[vars]
ALLOWED_ORIGINS = "https://freshterminal.ai,https://www.freshterminal.ai,https://imagine-os.github.io,http://localhost:5173,http://localhost:4173"
# Hub admins (C-087, C-088): Clerk user ids, comma-separated. Ids are not secret.
# Emails stay out of this public repo: they come from the ADMIN_EMAILS repository secret.
ADMIN_USER_IDS = ""
SITE_URL = "https://freshterminal.ai"
# The signed-in starter kit in dollars (C-089). It is also the pass-through threshold: once it is spent, paying starts.
ACCOUNT_STARTER_USD = "5"

[[d1_databases]]
binding = "DB"
database_name = "fresh-terminal"
# Replaced at deploy time by router-deploy.yml (the id is not a secret; it is looked up, not stored).
database_id = "D1_DATABASE_ID"
migrations_dir = "migrations"

# Free-credit abuse limits (router/src/credits.ts): paid calls per minute per IP and per network.
# Workers Rate Limiting: per Cloudflare location, eventually consistent; a brake, not accounting.
[[ratelimits]]
name = "RL_IP"
namespace_id = "7101"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_NET"
namespace_id = "7102"

  [ratelimits.simple]
  limit = 120
  period = 60
