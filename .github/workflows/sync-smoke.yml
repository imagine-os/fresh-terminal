name: sync-smoke

# End-to-end check of signed-in sync on the live router, run on demand.
# Creates a throwaway user in the Clerk DEVELOPMENT instance, mints a session
# token for it through the Clerk Backend API, calls /me and /sync/* on
# api.freshterminal.ai, then deletes the D1 rows and the user. Prints statuses
# and counts only; the session token is masked.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API: https://api.freshterminal.ai
    steps:
      - name: Refuse to run against a production Clerk instance
        run: |
          case "$CLERK_SECRET_KEY" in sk_test_*) echo "development instance: ok";; *) echo "not a development key; stopping"; exit 1;; esac
      - name: Throwaway user and session token
        id: user
        run: |
          clerk=(-H "Authorization: Bearer $CLERK_SECRET_KEY" -H 'Content-Type: application/json')
          user=$(curl -sS "${clerk[@]}" -X POST https://api.clerk.com/v1/users \
            -d "{\"email_address\":[\"ft-smoke-${GITHUB_RUN_ID}@freshterminal.ai\"],\"skip_password_requirement\":true,\"skip_password_checks\":true}")
          uid=$(echo "$user" | jq -r '.id // empty')
          [ -n "$uid" ] || { echo "user create failed: $(echo "$user" | jq -c '[.errors[]?.long_message // .errors[]?.message]')"; exit 1; }
          echo "uid=$uid" >> "$GITHUB_OUTPUT"
          echo "user: created"
          sess=$(curl -sS "${clerk[@]}" -X POST https://api.clerk.com/v1/sessions -d "{\"user_id\":\"$uid\"}")
          sid=$(echo "$sess" | jq -r '.id // empty')
          [ -n "$sid" ] || { echo "session create failed: $(echo "$sess" | jq -c '[.errors[]?.long_message // .errors[]?.message]')"; exit 1; }
          jwt=$(curl -sS "${clerk[@]}" -X POST "https://api.clerk.com/v1/sessions/$sid/tokens" -d '{}' | jq -r '.jwt // empty')
          [ -n "$jwt" ] || { echo "token mint failed"; exit 1; }
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> "$GITHUB_OUTPUT"
          echo "session token: minted"
      - name: /me and /sync on the live router
        env:
          JWT: ${{ steps.user.outputs.jwt }}
        run: |
          auth=(-H "Authorization: Bearer $JWT" -H 'Content-Type: application/json' -H 'Origin: https://freshterminal.ai')
          now=$(date +%s%3N)
          echo "GET /me: $(curl -sS "${auth[@]}" "$API/me" | jq -c '{signedIn, plan: .account.plan, sync}')"
          box="{\"id\":\"box-smoke-$GITHUB_RUN_ID\",\"name\":\"Smoke\",\"state_json\":\"{\\\"nav\\\":[]}\",\"created_at\":$now,\"updated_at\":$now,\"deleted_at\":null}"
          echo "PUT /sync/boxes: $(curl -sS "${auth[@]}" -X PUT "$API/sync/boxes" -d "{\"boxes\":[$box]}" | jq -c '{accepted: (.accepted|length), conflicts: (.conflicts|length), rejected: (.rejected|length)}')"
          echo "PUT older copy: $(curl -sS "${auth[@]}" -X PUT "$API/sync/boxes" -d "{\"boxes\":[$(echo "$box" | jq -c ".updated_at = $((now-1000)) | .name = \"stale\"")]}" | jq -c '{accepted: (.accepted|length), conflicts: [.conflicts[].name]}')"
          echo "GET /sync/boxes: $(curl -sS "${auth[@]}" "$API/sync/boxes?since=0" | jq -c '{boxes: [.boxes[] | .name]}')"
          entry="{\"id\":\"entry-smoke-$GITHUB_RUN_ID\",\"box_id\":\"box-smoke-$GITHUB_RUN_ID\",\"owner_identity\":\"anon-smoke\",\"kind\":\"charge\",\"what\":\"model.call\",\"model\":\"m\",\"units\":1,\"unit_kind\":\"call\",\"cost_micro\":1,\"price_micro\":1,\"ref\":\"\",\"created_at\":$now,\"prev_hash\":\"$(printf '0%.0s' $(seq 64))\",\"hash\":\"$(printf 'a%.0s' $(seq 64))\",\"shared_prev_hash\":null,\"shared_hash\":null}"
          echo "POST /sync/ledger: $(curl -sS "${auth[@]}" -X POST "$API/sync/ledger" -d "{\"entries\":[$entry]}" | jq -c '{received, written}')"
          echo "GET /sync/ledger: $(curl -sS "${auth[@]}" "$API/sync/ledger?since=0" | jq -c '{entries: (.entries|length)}')"
          echo "anonymous /sync/boxes: HTTP $(curl -sS -o /dev/null -w '%{http_code}' "$API/sync/boxes")"
      - name: Clean up (D1 rows, Clerk user)
        if: always() && steps.user.outputs.uid != ''
        env:
          UID_: ${{ steps.user.outputs.uid }}
        run: |
          cf=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          db=$(curl -sS "${cf[@]}" "$base?name=fresh-terminal" | jq -r '[.result[]? | select(.name=="fresh-terminal")][0].uuid // empty')
          acct="acct_$UID_"
          for table in ledger_entries boxes accounts; do
            col=$([ "$table" = accounts ] && echo id || echo account_id)
            ok=$(curl -sS "${cf[@]}" -X POST "$base/$db/query" -d "{\"sql\":\"DELETE FROM $table WHERE $col = ?\",\"params\":[\"$acct\"]}" | jq -r '.success')
            echo "delete $table rows: $ok"
          done
          echo "delete Clerk user: $(curl -sS -H "Authorization: Bearer $CLERK_SECRET_KEY" -X DELETE "https://api.clerk.com/v1/users/$UID_" | jq -r '.deleted')"
